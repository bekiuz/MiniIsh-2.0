<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0e16"><title>MiniIsh 2.0</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0e16;color:#f2f4fa;font:15px system-ui,Segoe UI,sans-serif}header{padding:20px max(20px,calc((100% - 1040px)/2));border-bottom:1px solid #252b3b;font-weight:850;letter-spacing:.5px}header b{color:#a78bfa}.main{max-width:1040px;margin:auto;padding:34px 20px}.hero h1{font-size:clamp(30px,5vw,46px);margin:0 0 8px}.hero p,.muted,small{color:#9aa2b5}.panel{background:#151a27;border:1px solid #2b3244;border-radius:17px;padding:20px;margin-top:18px}.panel h2{font-size:19px;margin:0 0 16px}.form{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}input,select,textarea{background:#0d121d;color:#f3f4f8;border:1px solid #343d52;border-radius:10px;padding:12px;min-width:0}input,select{flex:1}textarea{width:100%;margin-top:10px;resize:vertical}button{background:#8b70f6;color:white;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.alt,.ghost{background:#293145;color:#e7e9f2}.ghost{padding:8px 11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.stat{background:#191f2e;border:1px solid #2b3244;border-radius:13px;padding:15px}.stat b{display:block;font-size:23px}.stat small{display:block;margin-top:4px}.item,.job{background:#101521;border:1px solid #293247;border-radius:12px;padding:13px;margin-top:10px}.item{display:flex;align-items:center;gap:12px}.grow{flex:1}.grow small{display:block;margin-top:4px}.strike{text-decoration:line-through;color:#8b91a2}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.pill{background:#2c2546;color:#cbbcff;border-radius:999px;padding:6px 10px;font-size:12px}.answers{display:grid;gap:10px}.answer{background:#222b3d;text-align:left}.answer.correct{background:#176448}.answer.wrong{background:#783c4b}.script{white-space:pre-wrap;line-height:1.7;background:#0d121d;padding:16px;border-radius:12px;min-height:150px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.foot{max-width:1040px;margin:0 auto;padding:15px 20px 30px;color:#717b91;font-size:12px}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.form>*{width:100%;flex:auto}.main{padding-top:24px}}</style></head><body><header>B•BEKIUZ <b>MINIISH 2.0</b></header><main class="main"><section class="hero"><h1>MiniIsh 2.0</h1><p>Kichik topshiriqlarni joylang va demo e’lonlar taxtasini boshqaring.</p></section><section class="panel"><h2>Topshiriq joylash</h2><div class="form"><input id="title" placeholder="Masalan: Logo dizayn kerak"><input id="budget" type="number" placeholder="Byudjet (so‘m)"><select id="type"><option>Dizayn</option><option>Dasturlash</option><option>Matn yozish</option><option>Video montaj</option><option>Boshqa</option></select><button onclick="add()">Joylash</button></div><textarea id="desc" placeholder="Topshiriq tafsilotlari..." rows="3"></textarea></section><section class="stats" id="stats"></section><section class="panel"><div class="bar"><h2>Topshiriqlar</h2><input id="search" placeholder="Topshiriq qidirish..." oninput="render()" style="max-width:220px"><select id="filter" onchange="render()"><option value="all">Barchasi</option><option>Dizayn</option><option>Dasturlash</option><option>Matn yozish</option><option>Video montaj</option><option>Boshqa</option></select></div><div id="list"></div></section></main><footer class="foot">BEKIUZ · MiniIsh 2.0 · Ma’lumotlar faqat shu brauzerda saqlanadi. Haqiqiy buyurtmachi, ijrochi akkauntlari va onlayn to‘lovlar hali ulanmagan.</footer><script>let jobs=[];try{jobs=JSON.parse(localStorage.miniJobs||"[]");if(!Array.isArray(jobs))jobs=[]}catch(e){jobs=[]}function save(){localStorage.miniJobs=JSON.stringify(jobs);render()}function add(){let t=title.value.trim(),d=desc.value.trim(),b=+budget.value;if(!t||!d||b<0)return alert('Sarlavha va tavsifni kiriting.');jobs.unshift({id:Date.now(),t,d,b,type:type.value,date:new Date().toLocaleDateString('uz-UZ'),status:'Ochiq'});title.value=desc.value=budget.value='';save()}function toggleStatus(id){jobs=jobs.map(x=>x.id===id?{...x,status:x.status==='Bajarildi'?'Ochiq':'Bajarildi'}:x);save()}function del(id){if(!confirm('Topshiriq o‘chirilsinmi?'))return;jobs=jobs.filter(x=>x.id!==id);save()}function render(){let f=filter.value,q=(document.getElementById('search')?.value||'').trim().toLocaleLowerCase('uz-UZ'),open=jobs.filter(x=>x.status!=='Bajarildi').length,done=jobs.length-open;stats.innerHTML='<div class="stat"><b>'+jobs.length+'</b><small>Jami topshiriq</small></div><div class="stat"><b>'+open+'</b><small>Ochiq</small></div><div class="stat"><b>'+done+'</b><small>Bajarilgan</small></div>';list.innerHTML=jobs.filter(x=>(f==='all'||x.type===f)&&(!q||(x.t+' '+x.d).toLocaleLowerCase('uz-UZ').includes(q))).map(x=>'<article class="job"><div class="bar"><b>'+esc(x.t)+'</b><span class="pill">'+esc(x.type)+' · '+(x.status||'Ochiq')+'</span></div><p>'+esc(x.d)+'</p><div class="bar"><strong>'+(x.b>0?x.b.toLocaleString('uz-UZ')+' so‘m':'Kelishiladi')+'</strong><small>'+x.date+'</small><button class="ghost" onclick="toggleStatus('+x.id+')">'+(x.status==='Bajarildi'?'Qayta ochish':'Bajarildi')+'</button><button class="ghost" onclick="del('+x.id+')">O‘chirish</button></div></article>').join('')||'<p class="muted">Mos topshiriq topilmadi.</p>'}function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}render();</script></body></html>
